name: Expo iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      eas_build_id:
        description: "Existing EAS iOS build ID to submit to TestFlight"
        required: false
        type: string
  push:
    tags:
      - "mobile-v*"

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Show Xcode
        run: |
          xcodebuild -version

      - name: Setup Expo / EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run release quality checks
        run: npm run quality:ci

      - name: Write App Store Connect API key file
        working-directory: ${{ github.workspace }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"
          cat > "$API_KEY_PATH" <<'EOF'
          ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          EOF
          echo "API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Submit existing EAS build to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.eas_build_id != '' }}
        env:
          EXPO_ASC_API_KEY_PATH: ${{ env.API_KEY_PATH }}
          EXPO_ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: |
          eas submit \
            --platform ios \
            --profile production \
            --id "${{ inputs.eas_build_id }}" \
            --non-interactive \
            --verbose

      - name: EAS Build (cloud)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.eas_build_id == '' }}
        env:
          EXPO_ASC_API_KEY_PATH: ${{ env.API_KEY_PATH }}
          EXPO_ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: |
          # Build on EAS cloud so the pinned production image in eas.json is used.
          # Local GitHub macOS images can advance Xcode independently and break
          # native pods before Expo/React Native have caught up.
          BUILD_JSON="$RUNNER_TEMP/eas-build.json"
          eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --wait \
            --json > "$BUILD_JSON"
          BUILD_ID=$(BUILD_JSON="$BUILD_JSON" node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync(process.env.BUILD_JSON,'utf8')); const build=Array.isArray(data) ? data[0] : data; if (!build?.id) throw new Error('Missing EAS build id'); console.log(build.id);")
          echo "EAS_BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "Built EAS iOS build $BUILD_ID"

      - name: Submit cloud EAS build to TestFlight
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.eas_build_id == '' }}
        env:
          EXPO_ASC_API_KEY_PATH: ${{ env.API_KEY_PATH }}
          EXPO_ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: |
          eas submit \
            --platform ios \
            --profile production \
            --id "$EAS_BUILD_ID" \
            --non-interactive \
            --verbose
