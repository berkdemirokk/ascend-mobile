name: Expo iOS TestFlight

permissions:
  contents: read

concurrency:
  group: expo-ios-testflight
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      eas_build_id:
        description: "Existing EAS iOS build ID to submit to TestFlight"
        required: false
        type: string
  push:
    tags:
      - "mobile-v*"

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Show Xcode
        run: |
          xcodebuild -version

      - name: Setup Expo / EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: 22.2.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Verify canonical red-and-white app identity
        run: npm run verify:identity

      - name: Run release quality checks
        run: npm run quality:ci

      - name: Verify release secrets are configured
        working-directory: ${{ github.workspace }}
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in ASC_KEY ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured."
              exit 1
            fi
          done

      - name: Write App Store Connect API key file
        working-directory: ${{ github.workspace }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"
          cat > "$API_KEY_PATH" <<'EOF'
          ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          EOF
          chmod 600 "$API_KEY_PATH"
          if ! grep -q "BEGIN PRIVATE KEY" "$API_KEY_PATH"; then
            echo "::error::App Store Connect private key has an invalid format."
            exit 1
          fi
          echo "API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Submit existing EAS build to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.eas_build_id != '' }}
        env:
          EXPO_ASC_API_KEY_PATH: ${{ env.API_KEY_PATH }}
          EXPO_ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: |
          eas submit \
            --platform ios \
            --profile production \
            --id "${{ inputs.eas_build_id }}" \
            --non-interactive \
            --verbose

      - name: EAS Build (cloud)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.eas_build_id == '' }}
        env:
          EXPO_ASC_API_KEY_PATH: ${{ env.API_KEY_PATH }}
          EXPO_ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: |
          # Build on EAS cloud so the pinned production image in eas.json is used.
          # Local GitHub macOS images can advance Xcode independently and break
          # native pods before Expo/React Native have caught up.
          BUILD_JSON="$RUNNER_TEMP/eas-build.json"
          eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --wait \
            --json > "$BUILD_JSON"
          BUILD_ID=$(BUILD_JSON="$BUILD_JSON" node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync(process.env.BUILD_JSON,'utf8')); const build=Array.isArray(data) ? data[0] : data; if (!build?.id) throw new Error('Missing EAS build id'); console.log(build.id);")
          echo "EAS_BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "Built EAS iOS build $BUILD_ID"

      - name: Submit cloud EAS build to TestFlight
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.eas_build_id == '' }}
        env:
          EXPO_ASC_API_KEY_PATH: ${{ env.API_KEY_PATH }}
          EXPO_ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: |
          eas submit \
            --platform ios \
            --profile production \
            --id "$EAS_BUILD_ID" \
            --non-interactive \
            --verbose

      - name: Remove App Store Connect API key
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: rm -f "$RUNNER_TEMP/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"
