name: Deploy Supabase Edge Functions

permissions:
  contents: read

concurrency:
  group: deploy-supabase-edge-functions
  cancel-in-progress: false

# Deploys mobile/supabase/functions/* via the official Supabase CLI action.
# Triggers on:
#   - push to main when any function file changes
#   - manual dispatch (Actions tab → "Deploy Supabase Edge Functions" → Run)
#
# Required repo secrets:
#   SUPABASE_ACCESS_TOKEN   — personal access token from
#       https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF    — your project ref (the slug in the dashboard
#       URL, e.g. wihkcmgtzmdupxuyavyr)
#
# Supabase injects SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY into hosted Edge
# Functions. Configure only app-specific runtime secrets such as
# BROADCAST_SECRET in the Supabase dashboard.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.115.0

      - name: Verify required secrets are set
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repo secret is not set."
            exit 1
          fi
          if [ -z "$PROJECT_REF" ]; then
            echo "::error::SUPABASE_PROJECT_REF repo secret is not set."
            exit 1
          fi

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: mobile
        run: |
          supabase functions deploy delete-user \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt
          supabase functions deploy broadcast-push \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt

      - name: Verify deployment via HTTP probe
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # Function exists when an unauthenticated POST returns 401
          # ("Missing Authorization header"), not 404.
          for function_name in delete-user broadcast-push; do
            STATUS=$(curl --fail-with-body --retry 3 --retry-all-errors \
              -s -o /dev/null -w "%{http_code}" -X POST \
              "https://${PROJECT_REF}.supabase.co/functions/v1/${function_name}" || true)
            echo "${function_name} probe status: $STATUS"
            if [ "$STATUS" != "401" ]; then
              echo "::error::${function_name} expected an unauthenticated 401 response, received ${STATUS}."
              exit 1
            fi
          done
