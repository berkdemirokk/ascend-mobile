name: Verify App Store Connect

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      expected_build:
        description: "Exact iOS build number to verify (from the EAS submission)"
        required: true
        type: string
      simulator_launch:
        description: "Run iOS simulator launch diagnostic"
        type: boolean
        default: false
      diagnose_crashes:
        description: "Read sanitized TestFlight crash diagnostics for this build"
        type: boolean
        default: false

jobs:
  verify:
    if: ${{ !inputs.simulator_launch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify App Store Connect secrets
        working-directory: ${{ github.workspace }}
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          for name in ASC_KEY ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured."
              exit 1
            fi
          done

      - name: Write temporary App Store Connect API key
        working-directory: ${{ github.workspace }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"
          cat > "$API_KEY_PATH" <<'EOF'
          ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          EOF
          chmod 600 "$API_KEY_PATH"
          if ! grep -q "BEGIN PRIVATE KEY" "$API_KEY_PATH"; then
            echo "::error::App Store Connect private key has an invalid format."
            exit 1
          fi
          echo "ASC_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Install pinned verification dependencies
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            PyJWT==2.13.0 \
            cryptography==50.0.0 \
            requests==2.34.2

      - name: Verify app, subscriptions, and capabilities
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_PATH: ${{ env.ASC_KEY_PATH }}
          ASC_EXPECTED_BUILD: ${{ inputs.expected_build }}
          DIAGNOSE_CRASHES: ${{ inputs.diagnose_crashes }}
        run: |
          if [ "$DIAGNOSE_CRASHES" = "true" ]; then
            python3 scripts/diagnose_asc_crashes.py
          else
            python3 scripts/verify_asc.py
          fi

      - name: Remove App Store Connect API key
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: rm -f "$RUNNER_TEMP/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"

  simulator-launch:
    if: ${{ inputs.simulator_launch }}
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies and generate iOS project
        run: |
          npm ci
          npx expo prebuild --platform ios --no-install --non-interactive
          cd ios
          pod install
      - name: Build simulator release configuration
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ios-diagnostic"
          project=$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$project" && test -n "$workspace"
          scheme=$(basename "$project" .xcodeproj)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -sdk iphonesimulator -derivedDataPath "$RUNNER_TEMP/ascend-derived" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/ios-diagnostic/build.log"
      - name: Launch and observe
        run: |
          set -o pipefail
          device=$(xcrun simctl list devices available -j | ruby -rjson -e 'j=JSON.parse(STDIN.read); d=j["devices"].values.flatten.find { |x| x["name"].start_with?("iPhone") && x["isAvailable"] }; abort "No available iPhone simulator" unless d; puts d["udid"]')
          echo "$device" > "$RUNNER_TEMP/ios-diagnostic/device.txt"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          app=$(find "$RUNNER_TEMP/ascend-derived/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Info.plist")
          bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          echo "$executable" > "$RUNNER_TEMP/ios-diagnostic/executable.txt"
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" "$bundle" | tee "$RUNNER_TEMP/ios-diagnostic/launch.txt"
          sleep 30
          xcrun simctl spawn "$device" launchctl list > "$RUNNER_TEMP/ios-diagnostic/processes.txt"
          xcrun simctl io "$device" screenshot "$RUNNER_TEMP/ios-diagnostic/screen.png" || true
          pid=$(awk '{print $NF}' "$RUNNER_TEMP/ios-diagnostic/launch.txt")
          if ! [[ "$pid" =~ ^[0-9]+$ ]] || ! kill -0 "$pid" 2>/dev/null; then
            echo '::error::The app process was not running 30 seconds after launch.'
            exit 1
          fi
      - name: Collect simulator diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ios-diagnostic/crashes"
          if [ -f "$RUNNER_TEMP/ios-diagnostic/device.txt" ] && [ -f "$RUNNER_TEMP/ios-diagnostic/executable.txt" ]; then
            device=$(cat "$RUNNER_TEMP/ios-diagnostic/device.txt")
            executable=$(cat "$RUNNER_TEMP/ios-diagnostic/executable.txt")
            xcrun simctl spawn "$device" log show --last 10m --style compact --predicate "process == '$executable'" > "$RUNNER_TEMP/ios-diagnostic/simulator.log" 2>&1 || true
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name "$executable*" -mmin -30 -exec cp {} "$RUNNER_TEMP/ios-diagnostic/crashes/" \; 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-launch-diagnostics
          path: ${{ runner.temp }}/ios-diagnostic
          if-no-files-found: warn
          retention-days: 7
